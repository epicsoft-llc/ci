stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/ci"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

#### The tokens go in over stdin: '-p' would put them in the process list of the runner.
before_script:
  - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

.branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

#### Each platform is built, loaded and tested before the push, which reuses those layers from the builder cache.
#### The test: every tool of the image has to start. buildx reaches the TLS-secured dind only through a context.
.scriptBuild: &scriptBuild
  - echo "Build CI/CD Docker image with version '${VERSION}'"
  - docker context create dind
  - docker buildx create --name epicbuilder --driver docker-container --use dind
  - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  - |
    for platform in $(echo "${BUILD_PLATFORMS}" | tr ',' ' '); do
      docker buildx build . --load --pull --no-cache --platform "${platform}" -t ci:test \
        --build-arg IMAGE_TAG="${VERSION}" --build-arg BUILD_DATE="${BUILD_DATE}"
      docker run --rm --platform "${platform}" ci:test bash -c 'set -e; vault version; kubectl version --client; \
        helm version --short; aws --version; docker --version; docker compose version; git --version; jq --version; \
        yq --version; mariadb --version; ssh -V; lftp --version; rsync --version; envsubst --version; 7z > /dev/null; \
        echo -n test | sha256; sshpass -V; unzip -v > /dev/null; wget --version > /dev/null; curl --version'
    done
  - docker buildx build . --push --pull --platform ${BUILD_PLATFORMS} ${TAGS}
      --build-arg IMAGE_TAG=${VERSION} --build-arg BUILD_DATE=${BUILD_DATE}

latest:
  extends: .branch
  stage: build
  variables:
    VERSION: "latest"
  script:
    - TAGS="-t ${CI_REGISTRY_IMAGE}:${VERSION} -t ${DOCKER_REGISTRY}:${VERSION}"
    - *scriptBuild
  retry: 2

#### Versioned release from a git tag 'X.Y.Z' - the tags a CI job should pin. It also moves 'latest'.
release:
  extends: .tag
  stage: build
  variables:
    VERSION: "${CI_COMMIT_TAG}"
  script:
    #### a block scalar: as a plain list item the ': ' inside the message would make YAML read a key
    - |
      if ! grep -q "^## \[${VERSION}\] - " CHANGELOG.md; then
        echo "CHANGELOG.md has no entry '## [${VERSION}] - <date>'"
        exit 1
      fi
    - MAJOR_MINOR="${VERSION%.*}"
    - MAJOR="${MAJOR_MINOR%.*}"
    - |
      TAGS=""
      for tag in "${VERSION}" "${MAJOR_MINOR}" "${MAJOR}" latest; do
        TAGS="${TAGS} -t ${CI_REGISTRY_IMAGE}:${tag} -t ${DOCKER_REGISTRY}:${tag}"
      done
    - *scriptBuild
  retry: 1

uploadReadme:
  extends: .branch
  stage: release
  script:
    #### Docker Hub takes at most 25,000 characters - counted in bytes here, which is stricter
    - |
      size=$(wc -c < README.md)
      if [ "$size" -gt 25000 ]; then
        echo "README.md has $size bytes, Docker Hub takes 25000"
        exit 1
      fi
    #### '-e NAME' without a value reads it from the environment, so the token stays out of the process list
    - DOCKERHUB_PASSWORD="$DOCKER_HUB_TOKEN" docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="CI/CD tool collection on Alpine - Vault, kubectl, Helm, AWS CLI, Docker CLI and more, rebuilt weekly"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
  retry: 2

#### Waits until the push mirror has brought the tag to GitHub; GITHUB_TOKEN is protected, so the tags must be too.
github-release:
  extends: .tag
  stage: release
  image: epicsoft/ci:latest
  services: []
  before_script: []
  after_script: []
  needs:
    - job: release
  variables:
    GITHUB_REPO: "epicsoft-llc/${CI_PROJECT_NAME}"
  script:
    - |
      api="https://api.github.com/repos/${GITHUB_REPO}"
      #### curl reads the header from a file, so the token stays out of the process list
      auth_file=$(mktemp)
      printf 'Authorization: Bearer %s\n' "${GITHUB_TOKEN}" > "$auth_file"
      auth="@$auth_file"
      notes=$(awk -v head="## [${CI_COMMIT_TAG}]" 'index($0, head) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- > /dev/null
      echo "Release ${CI_COMMIT_TAG} created on GitHub"
